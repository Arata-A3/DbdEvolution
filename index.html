<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>DbD Evolution</title>
    <meta name="description" content="インフレ系クリック・放置ゲームです。">
    <!-- リンクを貼ったときのプレビュー（OGP） -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DbD Evolution">
    <meta property="og:title" content="DbD Evolution">
    <meta property="og:description" content="インフレ系クリック・放置ゲームです。">
    <meta property="og:url" content="https://arata-a3.github.io/DbdEvolution/">
    <meta property="og:image" content="https://arata-a3.github.io/DbdEvolution/og-image.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary">
    <style>
        :root {
            --bg-color: #080808;
            --panel-color: #121212;
            --card-bg: #1e1e1e;
            --accent-bp: #ff4d00;
            --accent-is: #00ffff;
            --accent-asc: #ff00ff;
            --accent-tra: #ffff00;
            --success-color: #4CAF50;
            --fail-color: #f44336;
            --text-color: #e0e0e0;
            --text-dim: #888;
            --needle-color: #fff;
            --sc-target-color: rgba(255, 255, 255, 0.2);
            --sc-great-color: #fff;
            --sc-border-color: rgba(255, 255, 255, 0.1);
            --panel-border: 1px solid rgba(128, 128, 128, 0.2);
            --progress-bg: rgba(0, 0, 0, 0.5);
            --key-bg: rgba(0, 0, 0, 0.2);
            --key-border-color: rgba(0, 0, 0, 0.4);
            --panel-item-bg: rgba(128, 128, 128, 0.1);
        }

        /* スキン設定 */
        .skin-default {
            --accent-bp: #ff4d00;
            --bg-gradient: radial-gradient(circle at center, #1a1a1a 0%, #080808 100%);
        }

        .skin-blood {
            --accent-bp: #880000;
            --bg-gradient: radial-gradient(circle at center, #330000 0%, #080000 100%);
        }

        .skin-neon {
            --accent-bp: #00ff00;
            --bg-gradient: radial-gradient(circle at center, #001a00 0%, #000800 100%);
        }

        .skin-void {
            --accent-bp: #4b0082;
            --bg-gradient: radial-gradient(circle at center, #1a0033 0%, #080008 100%);
        }

        .skin-cute {
            --accent-bp: #ff69b4;
            --bg-gradient: radial-gradient(circle at center, #fff0f5 0%, #ffc0cb 100%);
            --text-color: #5d2a42;
            --text-dim: #8b5a6d;
            --card-bg: rgba(255, 255, 255, 0.9);
            --panel-color: #fff0f5;
            --needle-color: #c71585;
            --sc-target-color: rgba(199, 21, 133, 0.2);
            --sc-great-color: #c71585;
            --sc-border-color: rgba(199, 21, 133, 0.15);
            --panel-border: 1px solid rgba(199, 21, 133, 0.2);
            --progress-bg: rgba(255, 182, 193, 0.3);
            --key-bg: #ffb6c1;
            --key-border-color: #ff69b4;
            --panel-item-bg: rgba(255, 182, 193, 0.4);
            --bg-color: #fffafc;
        }

        .skin-midnight {
            --accent-bp: #00ced1;
            --bg-gradient: linear-gradient(135deg, #000c1a 0%, #001f3f 100%);
            --needle-color: #00ffff;
        }

        .skin-golden {
            --accent-bp: #ffd700;
            --bg-gradient: radial-gradient(circle at center, #fff 0%, #f7e7ce 100%);
            --text-color: #4a3e10;
            --card-bg: #fffbf0;
            --needle-color: #b8860b;
            --sc-target-color: rgba(184, 134, 11, 0.3);
            --sc-great-color: #8b6508;
            --sc-border-color: rgba(184, 134, 11, 0.2);
            --panel-border: 1px solid rgba(184, 134, 11, 0.3);
            --progress-bg: rgba(218, 165, 32, 0.15);
            --key-bg: #fdf5e6;
            --key-border-color: #daa520;
            --panel-item-bg: rgba(218, 165, 32, 0.1);
            --text-dim: #8b6508;
            --bg-color: #fffbf0;
            --panel-color: #fdf5e6;
        }

        .skin-emerald {
            --accent-bp: #2ecc71;
            --bg-gradient: linear-gradient(180deg, #0a1f0a 0%, #000 100%);
            --needle-color: #00ff7f;
        }

        .skin-cute .needle {
            background: var(--needle-color);
            box-shadow: 0 0 15px var(--needle-color);
            width: 5px;
        }

        .skin-cute .needle {
            background: var(--needle-color);
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        }

        .skin-cute .key {
            background: #ffb6c1;
            border-bottom-color: #ff69b4;
            color: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        button,
        .upgrade-card,
        .skin-opt,
        .notice {
            touch-action: manipulation; /* ダブルタップでの拡大を防ぐ */
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 15px;
            padding: max(15px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(15px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
            gap: 10px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--panel-color);
            border-radius: 8px;
            border: var(--panel-border);
        }

        .title-group h1 {
            font-size: 1.5rem;
            color: var(--accent-bp);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .currency-group {
            display: flex;
            gap: 15px;
        }

        .currency {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .currency .label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .currency .value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .bp-val {
            color: var(--accent-bp);
        }

        .is-val {
            color: var(--accent-is);
        }

        .ap-val {
            color: var(--accent-asc);
        }

        .tp-val {
            color: var(--accent-tra);
            text-shadow: 0 0 10px var(--accent-tra);
        }

        main {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow: hidden;
        }

        .game-view {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: var(--bg-gradient, radial-gradient(circle at center, #1a1a1a 0%, #080808 100%));
            border-radius: 12px;
            border: var(--panel-border);
            position: relative;
            align-items: center;
            justify-content: center;
            touch-action: none; /* 長押し中にスクロール・ズームさせない */
            cursor: pointer;
        }

        .generator-box {
            width: 80%;
            margin-bottom: 40px;
            z-index: 1;
        }

        .progress-container {
            width: 100%;
            height: 24px;
            background: var(--progress-bg);
            border-radius: 12px;
            border: 2px solid var(--sc-border-color);
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-bp);
            box-shadow: 0 0 15px var(--accent-bp);
            transition: width 0.1s linear;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 2;
        }

        .skill-check-area {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sc-circle-border {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 8px solid var(--sc-border-color);
            border-radius: 50%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .sc-center-container {
            position: absolute;
            width: 0;
            height: 0;
            top: 120px;
            left: 120px;
        }

        .needle {
            position: absolute;
            width: 4px;
            height: 120px;
            background: var(--needle-color, #fff);
            left: -2px;
            bottom: 0;
            transform-origin: bottom center;
            box-shadow: 0 0 10px var(--needle-color, #fff);
            z-index: 10;
            display: none;
        }

        .target-zone,
        .great-zone {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            top: -120px;
            left: -120px;
            pointer-events: none;
        }

        .notice-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 50;
        }

        .notice {
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: none;
        }

        .asc-notice {
            background: var(--accent-asc);
            color: #000;
            box-shadow: 0 0 15px var(--accent-asc);
            animation: blink 1s infinite;
        }

        .tra-notice {
            background: var(--accent-tra);
            color: #000;
            box-shadow: 0 0 15px var(--accent-tra);
            animation: tra-glow 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        @keyframes tra-glow {

            0%,
            100% {
                box-shadow: 0 0 10px var(--accent-tra);
            }

            50% {
                box-shadow: 0 0 30px var(--accent-tra);
            }
        }

        .sidebar {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .tab-container {
            display: flex;
            gap: 4px;
            margin-bottom: 2px;
        }

        .tab {
            flex: 1;
            padding: 6px;
            background: var(--panel-item-bg);
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .tab.active {
            background: var(--accent-bp);
            color: #000;
        }

        .tab.is-tab.active {
            background: var(--accent-is);
            color: #000;
        }

        .tab.asc-tab.active {
            background: var(--accent-asc);
            color: #000;
        }

        .tab.tra-tab.active {
            background: var(--accent-tra);
            color: #000;
        }

        .upgrade-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            border: var(--panel-border);
            transition: 0.2s;
            cursor: pointer;
            margin-bottom: 6px;
            position: relative;
            color: var(--text-color);
        }

        .upgrade-card:hover:not(.disabled) {
            border-color: rgba(128, 128, 128, 0.5);
        }

        .upgrade-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .upgrade-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 0.85rem;
        }

        .upgrade-level {
            font-size: 0.65rem;
            background: rgba(0, 0, 0, 0.1);
            padding: 1px 6px;
            border-radius: 10px;
        }

        .upgrade-desc {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .upgrade-effect {
            font-size: 0.65rem;
            color: var(--text-dim);
            padding: 4px;
            background: var(--panel-item-bg);
            border-radius: 4px;
        }

        .system-panel {
            margin-top: auto;
            padding: 10px;
            background: var(--panel-color);
            border-radius: 8px;
            border: var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .save-btn {
            flex: 1;
            padding: 5px;
            font-size: 0.65rem;
            background: var(--panel-item-bg);
            border: none;
            cursor: pointer;
            border-radius: 3px;
            color: inherit;
        }

        #notify {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            transition: 0.3s;
            z-index: 100;
        }

        .controls-info {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .key {
            min-width: 80px;
            padding: 3px 8px;
            background: var(--key-bg);
            border-radius: 4px;
            border-bottom: 2px solid var(--key-border-color);
            text-align: center;
            font-weight: bold;
        }

        .save-group {
            display: flex;
            gap: 6px;
        }

        .control-hint {
            font-size: 0.65rem;
            opacity: 0.7;
        }

        .stats-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .cost-label {
            font-size: 0.7rem;
            font-weight: bold;
        }

        .cost-bp { color: var(--accent-bp); }
        .cost-is { color: var(--accent-is); }
        .cost-ap { color: var(--accent-asc); }
        .cost-tp { color: var(--accent-tra); }

        .action-btn {
            color: #000;
            font-weight: bold;
            width: 100%;
            border: none;
            padding: 6px;
            border-radius: 4px;
        }

        .skin-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .skin-opt {
            padding: 3px 8px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .skin-opt.active {
            background: var(--accent-bp);
            color: #000;
            border-color: transparent;
        }

        .skin-opt.locked {
            opacity: 0.15;
            cursor: not-allowed;
        }

        .working .generator-box {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(1px, 1px);
            }
        }

        /* ===== スマホ・タブレット（縦長・狭い画面） ===== */
        @media (max-width: 768px) {
            #app {
                padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
                gap: 6px;
            }

            header {
                padding: 6px 10px;
                gap: 8px;
            }

            header h1 {
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .currency-group {
                gap: 10px;
            }

            .currency .value {
                font-size: 0.9rem;
            }

            main {
                flex-direction: column;
                gap: 8px;
            }

            .game-view {
                flex: 0 0 auto;
                height: 48dvh;
                min-height: 290px;
                justify-content: space-evenly;
                padding: 8px 0;
            }

            .generator-box {
                width: 90%;
                margin-bottom: 0;
            }

            .skill-check-area {
                transform: scale(0.75);
                margin: -30px;
            }

            .controls-info {
                margin-top: 0;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px 12px;
                font-size: 0.7rem;
            }

            .control-hint {
                width: 100%;
                text-align: center;
            }

            .key {
                min-width: 0;
            }

            .stats-box {
                position: static;
                display: flex;
                gap: 12px;
                font-size: 0.7rem;
            }

            .notice-container {
                top: 64px;
            }

            .sidebar {
                flex: 1;
                min-height: 0;
                padding-right: 0;
            }

            .tab {
                padding: 10px 6px;
                font-size: 0.8rem;
            }

            .upgrade-card {
                padding: 12px;
            }

            .skin-opt {
                padding: 6px 12px;
                font-size: 0.7rem;
            }

            .save-btn {
                padding: 10px;
                font-size: 0.75rem;
            }
        }

        /* 画面がとても狭いとき（幅 380px 未満）はタイトルを隠して通貨表示を広げる */
        @media (max-width: 380px) {
            header h1 {
                display: none;
            }

            .currency-group {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* スマホ横向きなど、高さが低い画面 */
        @media (max-height: 520px) and (orientation: landscape) {
            #app {
                padding: 6px max(6px, env(safe-area-inset-right)) 6px max(6px, env(safe-area-inset-left));
                gap: 6px;
            }

            header {
                padding: 4px 12px;
            }

            header h1 {
                display: block;
                font-size: 1rem;
            }

            main {
                flex-direction: row;
            }

            .game-view {
                height: auto;
                min-height: 0;
                flex: 1.4;
            }

            .generator-box {
                margin-bottom: 4px;
            }

            .skill-check-area {
                transform: scale(0.6);
                margin: -48px;
            }

            .controls-info {
                display: none;
            }

            .stats-box {
                position: absolute;
                display: block;
                bottom: 6px;
                right: 10px;
            }

            .notice-container {
                top: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .working .generator-box,
            .asc-notice,
            .tra-notice {
                animation: none;
            }
        }
    </style>
</head>

<body id="app-body">
    <div id="app">
        <header>
            <h1>DbD Evolution</h1>
            <div class="currency-group">
                <div class="currency"><span class="label">BP</span><span class="value bp-val" id="bp-display">0</span>
                </div>
                <div class="currency"><span class="label">IS</span><span class="value is-val" id="is-display">0</span>
                </div>
                <div class="currency"><span class="label">AP</span><span class="value ap-val" id="ap-display">0</span>
                </div>
                <div class="currency"><span class="label">TP</span><span class="value tp-val" id="tp-display">0</span>
                </div>
            </div>
        </header>

        <div class="notice-container">
            <div id="asc-notice" class="notice asc-notice" onclick="switchTab('asc')">昇華可能</div>
            <div id="tra-notice" class="notice tra-notice" onclick="switchTab('tra')">超越可能</div>
        </div>

        <main>
            <div class="game-view" id="game-click-area">
                <div class="generator-box">
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                        <div class="progress-text" id="progress-text">0.00%</div>
                    </div>
                </div>
                <div class="skill-check-area">
                    <div class="sc-circle-border"></div>
                    <div class="sc-center-container" id="sc-circle">
                        <div id="target-zone" class="target-zone"></div>
                        <div id="great-zone" class="great-zone"></div>
                        <div id="needle" class="needle"></div>
                    </div>
                </div>
                <div class="controls-info">
                    <div class="control-item"><span class="key">長押し</span> <span>修理</span></div>
                    <div class="control-item"><span class="key">離す</span> <span>判定</span></div>
                    <div class="control-hint">マウス・タッチ・Spaceキー</div>
                </div>
                <div class="stats-box">
                    <div>Speed: <span id="stat-repair-speed">0.00</span>%/s</div>
                    <div>Gens: <span id="stat-gen-count">0</span></div>
                    <div>Mult: <span id="stat-multiplier" style="color:var(--accent-tra)">x1.0</span></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="tab-container">
                    <button class="tab bp-tab active" onclick="switchTab('bp')">BP</button>
                    <button class="tab is-tab" onclick="switchTab('is')">IS</button>
                    <button class="tab asc-tab" onclick="switchTab('asc')">昇華</button>
                    <button class="tab tra-tab" onclick="switchTab('tra')" id="tab-tra-btn"
                        style="display:none;">超越</button>
                </div>
                <div id="upgrade-container"></div>
                <div class="system-panel">
                    <div class="save-group">
                        <button class="save-btn" onclick="saveGame(true)">SAVE</button>
                        <button class="save-btn" onclick="loadAndRefresh()">LOAD</button>
                    </div>
                    <div id="status-info"
                        style="font-size: 0.65rem; color: var(--text-dim); text-align: center; margin: 5px 0; border-top: 1px solid rgba(128,128,128,0.1); padding-top: 5px;">
                        <span id="next-asc-info"></span><br>
                        <span id="total-asc-info"></span>
                    </div>
                    <button class="save-btn" onclick="fullResetInternal()"
                        style="background: rgba(255,0,0,0.1); color: #f55; margin-top: 5px;">【完全リセット】データを全て消去</button>
                </div>
            </div>
        </main>
    </div>

    <div id="notify">SAVED</div>

    <script src="lib/break_infinity.min.js"></script>
    <script>
        const SAVE_FINAL_KEY = 'dbd_evolution_v6_final_stabilized';
        const LEGACY_SAVE_KEY = 'dbd_inc_evolution_ultra_v4';
        const SAVE_VERSION = 2; // 2: 資源を Decimal（文字列）で保存
        const AUTO_SAVE_INTERVAL = 10000; // ms
        // Great 判定の幅（度）。5°だと 340°/s で約15ms しかなく、ほぼ狙えなかったため広げた
        const CONFIG = { BASE_REPAIR_SPEED: 0.5, BASE_NEEDLE_SPEED: 340, SC_COOLDOWN: 4500, GREAT_WIDTH: 10 };

        // ===== 大きな数（break_infinity.js の Decimal） =====
        // BP / IS / AP / TP / 修理数 と各倍率は Decimal で扱い、1e308 を超えても計算できるようにする
        const DECIMAL_KEYS = ['bp', 'is', 'ap', 'tp', 'genFinished', 'totalGenFinished'];
        function D(x) { return x instanceof Decimal ? x : new Decimal(x); }
        // 壊れた値（NaN / Infinity / 変換できない値）は 0 にする
        function toDec(v) {
            try {
                const d = D(v === undefined || v === null || v === '' ? 0 : v);
                return (Number.isFinite(d.mantissa) && Number.isFinite(d.exponent)) ? d : D(0);
            } catch (e) { return D(0); }
        }

        const DEFAULT_GAME = {
            saveVersion: SAVE_VERSION,
            bp: 0, is: 0, ap: 0, tp: 0,
            genFinished: 0, totalGenFinished: 0,
            ascensionLevel: 0, transcendenceLevel: 0,
            progress: 0,
            upgrades: {
                toolbox: 0, precision: 0, sc_bonus: 0, sc_frequency: 0,
                auto_repair: 0, mastery: 0,
                // IS拡張
                shard_refinery: 0, repair_overdrive: 0, bp_efficiency: 0
            },
            ascUpgrades: {
                ap_gain: 0, auto_check: 0, great_buff: 0, is_boost: 0, needle_stabilizer: 0,
                skin_unlock: 0,
                // 昇華拡張
                asc_speed_boost: 0, asc_bp_multiplier: 0
            },
            traUpgrades: {
                tra_mult: 0, tra_speed: 0, tra_auto_asc: 0
            },
            activeSkin: 'default'
        };

        function makeDefaultGame() {
            const g = JSON.parse(JSON.stringify(DEFAULT_GAME));
            DECIMAL_KEYS.forEach(k => g[k] = D(0));
            return g;
        }

        let game = makeDefaultGame();
        let temp = { isRepairing: false, skillCheckActive: false, needleAngle: 0, needleStartAngle: 0, needleStartTime: 0, targetRange: [0, 0], greatRange: [0, 0], activeTab: 'bp', scTimer: null, resetting: false };
        let lastTime = 0;

        // 安全に数値を取得（NaN対策）。レベルなど普通の数値用
        function n(val, fallback = 0) { return (typeof val === 'number' && Number.isFinite(val)) ? val : fallback; }

        // 整数表示（1e5 以上は指数表記。指数自体が巨大なら e1.23e6 のように表示）
        function f(x) {
            const d = toDec(x);
            if (d.lt(1e5)) return Math.floor(d.toNumber()).toLocaleString();
            let m = d.mantissa, e = d.exponent;
            if (Number(m.toFixed(2)) >= 10) { m /= 10; e += 1; } // 丸めで 10.00e5 にならないように
            if (e < 1e6) return `${m.toFixed(2)}e${e}`;
            return `e${f(e)}`;
        }
        // 小数を含む表示（倍率・速度用）
        function fx(x, digits = 1) {
            const d = toDec(x);
            return d.lt(1e5) ? d.toNumber().toFixed(digits) : f(d);
        }

        const DEF = {
            bp: {
                toolbox: { name: "改良工具箱", desc: "修理速度向上。", cost: (l) => Decimal.pow(1.5, n(l)).mul(50).floor(), effect: (l) => n(l) * 0.5, format: (v) => `+${fx(v)}%/s` },
                precision: { name: "精密技術", desc: "判定拡大 & 針減速。", cost: (l) => Decimal.pow(1.7, n(l)).mul(100).floor(), effect: (l) => ({ width: n(l) * 8, speed: Math.max(0.4, 1 - n(l) * 0.04) }), format: (v) => `+${v.width}°, x${v.speed.toFixed(2)}`, max: 15 },
                sc_bonus: { name: "BP収穫", desc: "スキルチェックBP増益。", cost: (l) => Decimal.pow(1.6, n(l)).mul(80).floor(), effect: (l) => n(l) * 0.5, format: (v) => `x${fx(1 + v)}` },
                sc_frequency: { name: "集中力", desc: "判定発生短縮。", cost: (l) => Decimal.pow(2, n(l)).mul(200).floor(), effect: (l) => n(l) * 200, format: (v) => `-${(v / 1000).toFixed(1)}s`, max: 16 }
            },
            is: {
                auto_repair: { name: "自動修理装置", desc: "放置修理。", cost: (l) => D(Math.floor(1 + n(l) * 2)), effect: (l) => n(l) * 0.3, format: (v) => `+${fx(v)}%/s` },
                mastery: { name: "超越的な知識", desc: "全獲得倍率上昇。", cost: (l) => D(Math.floor(5 + n(l) * 5)), effect: (l) => Decimal.pow(1.2, n(l)), format: (v) => `x${fx(v)}` },
                shard_refinery: { name: "IS精錬所", desc: "IS獲得量向上。", cost: (l) => D(Math.floor(10 + n(l) * 10)), effect: (l) => 1 + n(l) * 1.0, format: (v) => `x${fx(v)}` },
                repair_overdrive: { name: "修理OS強化", desc: "修理速度倍増。", cost: (l) => D(Math.floor(25 + n(l) * 25)), effect: (l) => 1 + n(l) * 0.5, format: (v) => `x${fx(v)}` },
                bp_efficiency: { name: "BP循環効率", desc: "BP獲得量向上。", cost: (l) => D(Math.floor(50 + n(l) * 50)), effect: (l) => 1 + n(l) * 0.2, format: (v) => `x${fx(v)}` }
            },
            asc: {
                ap_gain: { name: "効率的昇華", desc: "AP獲得量増加。", cost: (l) => D(Math.floor(1 + Math.pow(n(l), 1.5))), effect: (l) => 1 + n(l) * 0.2, format: (v) => `x${fx(v)}` },
                auto_check: { name: "自動回避", desc: "失敗時、確率回避。", cost: (l) => D(Math.floor(3 + n(l) * 3)), effect: (l) => Math.min(0.8, n(l) * 0.1), format: (v) => `${(v * 100).toFixed(0)}%`, max: 8 },
                great_buff: { name: "至高の職人", desc: "Great判定強化。", cost: (l) => D(Math.floor(5 + n(l) * 5)), effect: (l) => 1 + n(l) * 0.5, format: (v) => `x${fx(v)}` },
                is_boost: { name: "シャード共鳴", desc: "IS獲得量増加。", cost: (l) => D(Math.floor(2 + n(l) * 4)), effect: (l) => 1 + n(l) * 0.5, format: (v) => `x${fx(v)}` },
                needle_stabilizer: { name: "針の安定化", desc: "針の開始位置。", cost: (l) => D(Math.floor(10 + n(l) * 10)), effect: (l) => Math.min(90, n(l) * 15), format: (v) => `+${v}°`, max: 6 },
                skin_unlock: { name: "外装拡張", desc: "新スキン解放。", cost: (l) => D([2, 5, 12, 25, 40, 60, 99][n(l)] || 999), effect: (l) => n(l), format: (v) => `Lv.${v}`, max: 7 },
                asc_speed_boost: { name: "次元修理", desc: "全修理速度を大幅強化。", cost: (l) => D(Math.floor(15 + n(l) * 15)), effect: (l) => Decimal.pow(2, n(l)), format: (v) => `x${fx(v, 0)}` },
                asc_bp_multiplier: { name: "次元BP倍率", desc: "全BP獲得を大幅強化。", cost: (l) => D(Math.floor(20 + n(l) * 20)), effect: (l) => Decimal.pow(3, n(l)), format: (v) => `x${fx(v, 0)}` }
            },
            tra: {
                tra_mult: { name: "魂の渇望", desc: "全リソース獲得倍率強化。", cost: (l) => Decimal.pow(10, n(l)), effect: (l) => Decimal.pow(10, n(l)), format: (v) => `x${f(v)}` },
                tra_speed: { name: "次元の加速", desc: "修理の基礎速度を強化。", cost: (l) => Decimal.pow(5, n(l)).mul(5).floor(), effect: (l) => n(l) * 1.0, format: (v) => `+${fx(v)}%/s` },
                tra_auto_asc: { name: "自動昇華", desc: "条件を満たし次第、自動で昇華。", cost: () => D(100), effect: (l) => n(l) > 0, format: (v) => v ? "有効" : "無効", max: 1 }
            }
        };

        // タブ（カテゴリ）ごとの保存先と通貨
        const CAT = {
            bp: { store: 'upgrades', curr: 'bp' },
            is: { store: 'upgrades', curr: 'is' },
            asc: { store: 'ascUpgrades', curr: 'ap' },
            tra: { store: 'traUpgrades', curr: 'tp' }
        };

        const SKINS = {
            default: { name: "Classic", class: "skin-default", unlocked: () => true },
            blood: { name: "Blood", class: "skin-blood", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 1 },
            neon: { name: "Neon", class: "skin-neon", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 2 },
            void: { name: "Void", class: "skin-void", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 3 },
            cute: { name: "Kawaii🎀", class: "skin-cute", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 4 },
            midnight: { name: "Midnight", class: "skin-midnight", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 5 },
            golden: { name: "Golden", class: "skin-golden", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 6 },
            emerald: { name: "Emerald", class: "skin-emerald", unlocked: () => n(game.ascUpgrades.skin_unlock) >= 7 }
        };

        function getMultiplier() {
            return D(DEF.is.mastery.effect(game.upgrades.mastery))
                .mul(1 + n(game.ascensionLevel) * 0.5)
                .mul(Decimal.pow(1000, n(game.transcendenceLevel)))
                .mul(DEF.tra.tra_mult.effect(game.traUpgrades.tra_mult));
        }

        function getBPMultiplier() {
            return D(DEF.asc.asc_bp_multiplier.effect(game.ascUpgrades.asc_bp_multiplier)).mul(DEF.is.bp_efficiency.effect(game.upgrades.bp_efficiency));
        }

        function getRepairSpeedMultiplier() {
            return D(DEF.asc.asc_speed_boost.effect(game.ascUpgrades.asc_speed_boost)).mul(DEF.is.repair_overdrive.effect(game.upgrades.repair_overdrive));
        }

        function getBaseRepairSpeed() {
            return CONFIG.BASE_REPAIR_SPEED + n(DEF.tra.tra_speed.effect(game.traUpgrades.tra_speed));
        }

        function getISMultiplier() {
            return D(DEF.is.shard_refinery.effect(game.upgrades.shard_refinery)).mul(DEF.asc.is_boost.effect(game.ascUpgrades.is_boost));
        }

        function getAscReq() { return 5 + n(game.ascensionLevel) * 5; }

        function getAPGain(gens = game.genFinished) {
            return toDec(gens).div(2).mul(DEF.asc.ap_gain.effect(game.ascUpgrades.ap_gain)).floor();
        }

        // AP獲得量が今より増えるまでに必要な修理数（AP倍率を考慮）
        function gensToNextAP() {
            if (game.genFinished.gte(1e15)) return 1; // 桁が大きいときは 1 修理ごとに増える
            const g = game.genFinished.toNumber(); const m = DEF.asc.ap_gain.effect(game.ascUpgrades.ap_gain);
            const gain = (x) => Math.floor(x / 2 * m);
            const cur = gain(g);
            let k = Math.max(1, Math.ceil(2 * (cur + 1) / m) - g);
            while (k > 1 && gain(g + k - 1) > cur) k--;
            while (gain(g + k) <= cur && k < 1e6) k++;
            return k;
        }

        function getTPGain() { return Decimal.pow(10, n(game.ascensionLevel) - 10).floor(); }

        function init() {
            loadGame();
            applySkin(game.activeSkin || 'default', true);
            renderUpgrades();
            updateUI();
            requestAnimationFrame(gameLoop);

            // 自動セーブ（定期 + 閉じる/裏に回るとき）
            setInterval(() => saveGame(), AUTO_SAVE_INTERVAL);
            window.addEventListener('beforeunload', () => saveGame());
            document.addEventListener('visibilitychange', () => { if (document.hidden) { stopRepair(); saveGame(); } });

            // マウス・タッチ・ペンは Pointer Events でまとめて扱う
            const area = document.getElementById('game-click-area');
            area.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault(); // タッチ時のスクロール・ズーム・長押しメニューを防ぐ
                startRepair();
            });
            window.addEventListener('pointerup', stopRepair);
            window.addEventListener('pointercancel', stopRepair);
            window.addEventListener('blur', stopRepair);
            area.addEventListener('contextmenu', (e) => e.preventDefault());

            // Space はフォーカス中のボタン（LOAD・リセットなど）を押さないよう、押下・離上とも既定動作を止める
            window.addEventListener('keydown', (e) => {
                if (e.code !== 'Space') return;
                e.preventDefault();
                if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
                if (!e.repeat) startRepair();
            });
            window.addEventListener('keyup', (e) => { if (e.code === 'Space') { e.preventDefault(); stopRepair(); } });
        }

        function startRepair() {
            if (temp.isRepairing) return;
            temp.isRepairing = true;
            if (temp.scTimer) clearInterval(temp.scTimer);
            const freq = Math.max(1200, CONFIG.SC_COOLDOWN - DEF.bp.sc_frequency.effect(game.upgrades.sc_frequency));
            temp.scTimer = setInterval(() => {
                if (temp.isRepairing && !temp.skillCheckActive) triggerSkillCheck();
            }, freq);
        }

        function stopRepair() {
            if (!temp.isRepairing) return;
            temp.isRepairing = false;
            if (temp.skillCheckActive) handleSkillCheck();
            clearInterval(temp.scTimer);
        }

        // スキルチェック開始からの経過時間で針の角度を求める（フレームの粗さに左右されない）
        function currentNeedleAngle(now = performance.now()) {
            const spd = n(DEF.bp.precision.effect(game.upgrades.precision).speed, 1);
            return temp.needleStartAngle + CONFIG.BASE_NEEDLE_SPEED * spd * (now - temp.needleStartTime) / 1000;
        }

        function triggerSkillCheck() {
            temp.skillCheckActive = true;
            temp.needleStartAngle = n(DEF.asc.needle_stabilizer.effect(game.ascUpgrades.needle_stabilizer));
            temp.needleStartTime = performance.now();
            temp.needleAngle = temp.needleStartAngle;
            const needle = document.getElementById('needle');
            if (needle) { needle.style.display = 'block'; needle.style.transform = `rotate(${temp.needleAngle}deg)`; }
            const prec = DEF.bp.precision.effect(game.upgrades.precision);
            const width = 20 + n(prec.width);
            // ゾーンが一周（360°）を超えて針が届かない部分ができないようにする
            const minStart = 140, maxEnd = 350;
            const start = minStart + Math.random() * Math.max(0, maxEnd - minStart - width);
            const end = start + width;
            temp.targetRange = [start, end]; temp.greatRange = [start, start + CONFIG.GREAT_WIDTH];

            // スタイルから現在のスキンの色を取得
            const style = getComputedStyle(document.body);
            const targetColor = style.getPropertyValue('--sc-target-color').trim();
            const greatColor = style.getPropertyValue('--sc-great-color').trim();

            document.getElementById('target-zone').style.background = `conic-gradient(transparent ${start}deg, ${targetColor} ${start}deg, ${targetColor} ${end}deg, transparent ${end}deg)`;
            const gEnd = start + CONFIG.GREAT_WIDTH;
            document.getElementById('great-zone').style.background = `conic-gradient(transparent ${start}deg, ${greatColor} ${start}deg, ${greatColor} ${gEnd}deg, transparent ${gEnd}deg)`;
        }

        function handleSkillCheck() {
            if (!temp.skillCheckActive) return;
            const angle = currentNeedleAngle(); const mult = getMultiplier();
            const bpBonus = 1 + n(DEF.bp.sc_bonus.effect(game.upgrades.sc_bonus));
            const gMult = n(DEF.asc.great_buff.effect(game.ascUpgrades.great_buff), 1);
            temp.skillCheckActive = false;

            if (angle >= temp.greatRange[0] && angle <= temp.greatRange[1]) {
                game.bp = game.bp.add(D(1000).mul(mult).mul(bpBonus * gMult).mul(getBPMultiplier()));
                addProgress(D(25).mul(mult).mul(gMult).mul(getRepairSpeedMultiplier()));
                notify("GREAT!");
            } else if (angle >= temp.targetRange[0] && angle <= temp.targetRange[1]) {
                game.bp = game.bp.add(D(60).mul(mult).mul(bpBonus).mul(getBPMultiplier()));
                addProgress(D(4).mul(mult).mul(getRepairSpeedMultiplier()));
                notify("GOOD");
            } else {
                if (Math.random() < DEF.asc.auto_check.effect(game.ascUpgrades.auto_check)) notify("EVADED!");
                else game.progress = Math.max(0, game.progress - 15);
            }
            document.getElementById('needle').style.display = 'none';
            document.getElementById('target-zone').style.background = document.getElementById('great-zone').style.background = 'none';
            updateUI();
        }

        // 修理進捗を加算し、100% を超えた分だけ発電機を完成させる
        function addProgress(amount) {
            const total = D(game.progress).add(amount);
            if (total.lt(100)) { game.progress = Math.max(0, total.toNumber()); return; }
            const c = total.div(100).floor();
            // 桁が大きすぎると端数に意味がないので 0 にする
            game.progress = total.lt(1e15) ? total.toNumber() % 100 : 0;
            completeGenerators(c);
        }

        function completeGenerators(c) {
            game.genFinished = game.genFinished.add(c);
            game.totalGenFinished = game.totalGenFinished.add(c);
            game.is = game.is.add(D(c).mul(getMultiplier()).mul(getISMultiplier()));
            updateUI();

            // 自動昇華チェック
            if (DEF.tra.tra_auto_asc.effect(game.traUpgrades.tra_auto_asc) && game.genFinished.gte(getAscReq())) doAscension();
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.5) dt = 0; // スパイク用

            let speed = 0;
            if (temp.isRepairing) {
                speed += getBaseRepairSpeed() + n(DEF.bp.toolbox.effect(game.upgrades.toolbox));
                document.body.classList.add('working');
            } else { document.body.classList.remove('working'); }
            speed += n(DEF.is.auto_repair.effect(game.upgrades.auto_repair));

            const speedEl = document.getElementById('stat-repair-speed');
            if (speed > 0) {
                const realSpeed = D(speed).mul(getRepairSpeedMultiplier()).mul(getMultiplier());
                speedEl.textContent = fx(realSpeed, 2);
                if (dt > 0) addProgress(realSpeed.mul(dt));
            } else speedEl.textContent = "0.00";

            if (temp.skillCheckActive) {
                temp.needleAngle = currentNeedleAngle();
                document.getElementById('needle').style.transform = `rotate(${temp.needleAngle}deg)`;
                if (temp.needleAngle > 360) handleSkillCheck();
            }

            document.getElementById('progress-bar').style.width = `${game.progress.toFixed(2)}%`;
            document.getElementById('progress-text').textContent = `${game.progress.toFixed(2)}%`;

            requestAnimationFrame(gameLoop);
        }

        function switchTab(t) { temp.activeTab = t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.classList.contains(t + '-tab'))); renderUpgrades(); }

        // アップグレードカード 1 枚分の HTML
        function upgradeCardHTML(cat, id) {
            const def = DEF[cat][id]; const { store, curr } = CAT[cat];
            const lv = n(game[store][id]);
            const isMax = !!def.max && lv >= def.max;
            const cost = isMax ? D(0) : D(def.cost(lv));
            const canBuy = !isMax && game[curr].gte(cost);
            return `<div class="upgrade-card ${canBuy ? '' : 'disabled'}" data-cost="${cost.toString()}" data-currency="${curr}" ${isMax ? 'data-max="true"' : ''} onclick="buyUpgrade('${cat}','${id}')">
                <div class="upgrade-header"><span class="upgrade-name">${def.name}</span><span class="upgrade-level">${isMax ? 'MAX' : 'Lv.' + lv}</span></div>
                <div class="upgrade-desc">${def.desc}</div>
                <div class="upgrade-effect">現在: ${def.format(def.effect(lv))} ${isMax ? '' : '<span style="opacity:0.4">→</span> 次: ' + def.format(def.effect(lv + 1))}</div>
                <div class="upgrade-footer"><span class="cost-label cost-${curr}">${isMax ? 'MAX' : f(cost) + ' ' + curr.toUpperCase()}</span></div></div>`;
        }

        function buyUpgrade(cat, id) {
            const def = DEF[cat][id]; const { store, curr } = CAT[cat];
            const lv = n(game[store][id]);
            if (def.max && lv >= def.max) return;
            const cost = D(def.cost(lv));
            if (!game[curr].gte(cost)) return;
            game[curr] = game[curr].sub(cost);
            game[store][id] = lv + 1;
            renderUpgrades(); updateUI(); saveGame();
        }

        function renderUpgrades() {
            const container = document.getElementById('upgrade-container');
            const cat = temp.activeTab;
            let html = '';
            if (cat === 'asc') html += ascensionHeaderHTML();
            if (cat === 'tra') html += transcendenceHeaderHTML();
            html += Object.keys(DEF[cat]).map(id => upgradeCardHTML(cat, id)).join('');
            container.innerHTML = html;
        }

        function ascensionHeaderHTML() {
            const req = getAscReq();
            let html = `<div class="upgrade-card ${game.genFinished.gte(req) ? '' : 'disabled'}" data-req-gen="${req}" style="border: 1px solid var(--accent-asc); background: rgba(128,0,128,0.05);">
                <h3 style="color: var(--accent-asc); margin-bottom: 3px; font-size:0.9rem;">昇華 (Ascension)</h3>
                <p style="font-size: 0.7rem; margin-bottom: 4px;">獲得可能: <strong style="color:var(--accent-asc)" id="asc-gain-val">+${f(getAPGain())} AP</strong></p>
                <p style="font-size: 0.6rem; color: var(--text-dim); margin-bottom: 8px;" id="asc-next-ap-val">(あと ${f(gensToNextAP())} 修理完了で AP増加)</p>
                <button class="save-btn action-btn" style="background: var(--accent-asc);" onclick="doAscension()">昇華を実行</button></div>`;

            if (n(game.ascUpgrades.skin_unlock) > 0) {
                html += `<div style="font-size:0.6rem; color:var(--text-dim); margin-top:10px; font-weight:bold;">外装カスタマイズ</div><div class="skin-selector">`;
                Object.keys(SKINS).forEach(id => html += `<div class="skin-opt ${SKINS[id].unlocked() ? '' : 'locked'} ${game.activeSkin === id ? 'active' : ''}" onclick="applySkin('${id}')">${SKINS[id].name}</div>`);
                html += `</div>`;
            }

            html += `<div style="margin-top:12px; border-top: 1px solid rgba(128,128,128,0.2); padding-top:8px; font-size:0.7rem; color:var(--accent-asc); font-weight:bold; margin-bottom:5px;">AP永続アップグレード</div>`;
            return html;
        }

        function transcendenceHeaderHTML() {
            const canTra = n(game.ascensionLevel) >= 10;
            return `<div style="margin-top:5px; border-bottom: 1px solid var(--accent-tra); padding-bottom:8px; font-size:0.8rem; color:var(--accent-tra); font-weight:bold; margin-bottom:10px;">超越 (Transcendence)</div>
                <div class="upgrade-card ${canTra ? '' : 'disabled'}" data-req-asc="10" style="border: 2px solid var(--accent-tra); background: rgba(255,255,0,0.05); margin-bottom:15px;">
                <h3 style="color: var(--accent-tra); margin-bottom: 5px; font-size:0.9rem;">世界の超越</h3>
                <p style="font-size: 0.7rem; line-height: 1.4; margin-bottom: 8px;">APアップグレードを含む全てを捧げ、TPを獲得します。<br>
                獲得可能: <strong style="color:var(--accent-tra)">+${f(getTPGain())} TP</strong></p>
                <p style="font-size: 0.6rem; color: var(--text-dim); margin-bottom: 8px;">初期条件: 昇華Lv.10 到達 (現在: Lv.${game.ascensionLevel})</p>
                <button class="save-btn action-btn" style="background: var(--accent-tra); padding: 10px;" onclick="doTranscendence()">超越を実行</button>
            </div>
            <div style="font-size:0.7rem; color:var(--accent-tra); font-weight:bold; margin-bottom:8px;">TP永続アップグレード</div>`;
        }

        function applySkin(id, silent = false) {
            if (!SKINS[id] || !SKINS[id].unlocked()) id = 'default';
            game.activeSkin = id; document.body.className = SKINS[id].class;
            if (temp.activeTab === 'asc') renderUpgrades();
            if (!silent) saveGame();
        }

        function doAscension() {
            if (!game.genFinished.gte(getAscReq())) return;
            game.ap = game.ap.add(getAPGain());
            game.ascensionLevel++;
            game.bp = D(0); game.is = D(0); game.genFinished = D(0); game.progress = 0;
            Object.keys(game.upgrades).forEach(k => game.upgrades[k] = 0);
            saveGame(); updateUI(); switchTab('bp');
        }

        function doTranscendence() {
            if (n(game.ascensionLevel) < 10) return;
            const gainTP = getTPGain();
            game.transcendenceLevel++;
            game.tp = game.tp.add(gainTP);
            game.bp = D(0); game.is = D(0); game.ap = D(0); game.genFinished = D(0);
            game.ascensionLevel = 0; game.progress = 0;
            Object.keys(game.upgrades).forEach(k => game.upgrades[k] = 0);
            Object.keys(game.ascUpgrades).forEach(k => game.ascUpgrades[k] = 0);
            applySkin(game.activeSkin, true); // 解放が外れたスキンは Classic に戻る
            saveGame();
            updateUI();
            switchTab('bp');
            notify(`+${f(gainTP)} TP獲得！`);
        }

        function updateUI() {
            document.getElementById('bp-display').textContent = f(game.bp);
            document.getElementById('is-display').textContent = f(game.is);
            document.getElementById('ap-display').textContent = f(game.ap);
            document.getElementById('tp-display').textContent = f(game.tp);
            document.getElementById('stat-gen-count').textContent = f(game.genFinished);
            document.getElementById('stat-multiplier').textContent = `x${fx(getMultiplier())}`;

            const req = getAscReq();
            document.getElementById('asc-notice').style.display = game.genFinished.gte(req) ? 'block' : 'none';
            document.getElementById('tra-notice').style.display = (n(game.ascensionLevel) >= 10) ? 'block' : 'none';

            const nextInfo = document.getElementById('next-asc-info');
            if (nextInfo) nextInfo.textContent = `次回の昇華まで: ${f(Decimal.max(0, D(req).sub(game.genFinished)))} 修理`;
            const totalInfo = document.getElementById('total-asc-info');
            if (totalInfo) totalInfo.textContent = `累計昇華Lv: ${game.ascensionLevel}`;

            // 昇華タブ内の詳細表示を更新（タブが開いている場合のみ）
            if (temp.activeTab === 'asc') {
                const gainVal = document.getElementById('asc-gain-val');
                if (gainVal) gainVal.textContent = `+${f(getAPGain())} AP`;
                const nextApVal = document.getElementById('asc-next-ap-val');
                if (nextApVal) nextApVal.textContent = `(あと ${f(gensToNextAP())} 修理完了で AP増加)`;
            }

            const traTab = document.getElementById('tab-tra-btn');
            if (traTab) {
                const shouldShow = (n(game.ascensionLevel) >= 5 || game.tp.gt(0));
                traTab.style.display = shouldShow ? 'block' : 'none';
                if (!shouldShow && temp.activeTab === 'tra') switchTab('bp');
            }
            refreshUpgradeStates();
        }

        function refreshUpgradeStates() {
            document.querySelectorAll('.upgrade-card').forEach(card => {
                const cost = card.getAttribute('data-cost');
                const curr = card.getAttribute('data-currency');
                const reqGen = card.getAttribute('data-req-gen');
                const reqAsc = card.getAttribute('data-req-asc');
                const isMax = card.getAttribute('data-max') === 'true';

                let canAfford = !isMax;
                if (canAfford && cost !== null && curr !== null) canAfford = game[curr].gte(toDec(cost));
                if (canAfford && reqGen !== null) canAfford = game.genFinished.gte(toDec(reqGen));
                if (canAfford && reqAsc !== null) canAfford = n(game.ascensionLevel) >= parseInt(reqAsc);

                card.classList.toggle('disabled', !canAfford);
            });
        }

        // 読み込んだデータの型を整える（Decimal 化・壊れた値の除去）
        function sanitizeState() {
            DECIMAL_KEYS.forEach(k => game[k] = toDec(game[k]));
            game.progress = Math.min(100, Math.max(0, n(game.progress)));
            game.ascensionLevel = n(game.ascensionLevel);
            game.transcendenceLevel = n(game.transcendenceLevel);
            ['upgrades', 'ascUpgrades', 'traUpgrades'].forEach(s => Object.keys(game[s]).forEach(k => game[s][k] = n(game[s][k])));
            game.saveVersion = SAVE_VERSION;
        }

        // showNotify は SAVE ボタンを押したときだけ true（自動セーブや購入時は通知しない）
        function saveGame(showNotify = false) {
            if (temp.resetting) return;
            try {
                localStorage.setItem(SAVE_FINAL_KEY, JSON.stringify(game)); // Decimal は文字列として保存される
                if (showNotify) notify("SAVED");
            } catch (err) {
                console.error('セーブに失敗しました', err);
                if (showNotify) notify("SAVE FAILED");
            }
        }

        function loadGame() {
            let d = null;
            try { d = localStorage.getItem(SAVE_FINAL_KEY) || localStorage.getItem(LEGACY_SAVE_KEY); } catch (err) { console.error(err); }
            game = makeDefaultGame();
            if (!d) return;
            let p;
            try {
                p = JSON.parse(d);
                if (!p || typeof p !== 'object') throw new Error('invalid save');
            } catch (err) {
                // 壊れたデータは別キーに退避して、初期状態で起動する
                console.error('セーブデータを読み込めませんでした', err);
                try { localStorage.setItem(SAVE_FINAL_KEY + '_corrupted', d); } catch (e2) { }
                setTimeout(() => notify("セーブデータ破損: 初期化しました"), 0);
                return;
            }
            // ディープマージ
            Object.keys(DEFAULT_GAME).forEach(k => {
                if (DEFAULT_GAME[k] !== null && typeof DEFAULT_GAME[k] === 'object') {
                    game[k] = { ...DEFAULT_GAME[k], ...(p[k] || {}) };
                } else if (p[k] !== undefined) {
                    game[k] = p[k];
                }
            });
            sanitizeState();
        }

        // LOAD ボタン: 最後のセーブに戻して画面を作り直す
        function loadAndRefresh() {
            stopRepair();
            loadGame();
            applySkin(game.activeSkin || 'default', true);
            renderUpgrades();
            updateUI();
            notify("LOADED");
        }

        function fullResetInternal() {
            if (confirm("全てのデータを完全に削除し、初期状態に戻しますか？（元に戻せません）")) {
                // このゲームのキーだけ消す（同じドメインの他サイトのデータは残す）
                temp.resetting = true; // リロード時の自動セーブで書き戻さない
                [SAVE_FINAL_KEY, LEGACY_SAVE_KEY, SAVE_FINAL_KEY + '_corrupted'].forEach(k => localStorage.removeItem(k));
                location.reload();
            }
        }

        let notifyTimer = null;
        function notify(m) {
            const e = document.getElementById('notify'); e.textContent = m; e.style.opacity = 1;
            clearTimeout(notifyTimer); notifyTimer = setTimeout(() => e.style.opacity = 0, 1500);
        }

        init();
    </script>
</body>

</html>
